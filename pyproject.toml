[project]
name = "zeitenwende-sgns"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fabian Simonjetz", email = "fsimonjetz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "de-core-news-sm",
    "gensim>=4.4.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "polars>=2.0.0",
    "requests>=2.34.2",
    "simplemma>=2.0.0",
    "spacy>=3.8.16",
    "tqdm>=4.70.1",
]

[project.scripts]
zeitenwende-sgns = "zeitenwende_sgns:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
